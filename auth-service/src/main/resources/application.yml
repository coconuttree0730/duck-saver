server:
  port: 5000
  servlet:
    context-path: /uaa

spring:
  application:
    name: auth-service
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:sentinel-dashboard:8858}
      eager: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/duck_saver_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:auth_user}
    password: ${MYSQL_PASSWORD:dev_password}
    authentication-database: admin
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}

sa-token:
  token-name: satoken
  jwt-secret-key: ${JWT_SECRET_KEY:duck-saver-dev-jwt-secret}
  timeout: 2592000
  is-concurrent: true
  is-share: true
  token-style: uuid

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
