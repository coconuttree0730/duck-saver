server:
  port: 6000
  servlet:
    context-path: /accounts

spring:
  application:
    name: account-service
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:sentinel-dashboard:8858}
      eager: false
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            rule-type: flow
        system:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-system-rules
            group-id: SENTINEL_GROUP
            rule-type: system
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/duck_saver_account?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:account_user}
    password: ${MYSQL_PASSWORD:dev_password}
      authentication-database: admin

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
