global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:4000']

  - job_name: 'auth-service'
    metrics_path: '/uaa/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:5000']

  - job_name: 'account-service'
    metrics_path: '/accounts/actuator/prometheus'
    static_configs:
      - targets: ['account-service:6000']

  - job_name: 'statistics-service'
    metrics_path: '/statistics/actuator/prometheus'
    static_configs:
      - targets: ['statistics-service:7000']

  - job_name: 'notification-service'
    metrics_path: '/notifications/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8000']

  - job_name: 'ai-service'
    metrics_path: '/ai/actuator/prometheus'
    static_configs:
      - targets: ['ai-service:9000']
