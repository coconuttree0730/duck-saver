server:
  port: 7000
  servlet:
    context-path: /statistics

spring:
  application:
    name: statistics-service
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:sentinel-dashboard:8858}
      eager: false
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            rule-type: flow
        system:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-system-rules
            group-id: SENTINEL_GROUP
            rule-type: system
  data:
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}
      username: ${MONGODB_USER:user}
      password: ${MONGODB_PASSWORD:password}
      database: piggymetrics
      authentication-database: admin

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

rates:
  url: https://api.exchangeratesapi.io

logging:
  level:
    org.springframework.security: INFO
