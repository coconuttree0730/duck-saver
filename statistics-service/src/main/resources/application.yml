server:
  port: 7000
  servlet:
    context-path: /statistics

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
  application:
    name: statistics-service
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:sentinel-dashboard:8858}
      eager: false
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            rule-type: flow
        system:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
            data-id: ${spring.application.name}-system-rules
            group-id: SENTINEL_GROUP
            rule-type: system
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/duck_saver_statistics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:statistics_user}
    password: ${MYSQL_PASSWORD:dev_password}

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html


logging:
  level:
    org.springframework.security: INFO
