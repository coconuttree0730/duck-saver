
services:
  nacos-server:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - 127.0.0.1:8848:8848
      - 127.0.0.1:9848:9848
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:16379:6379
    restart: always

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-password}
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo-data:/data/db
    restart: always

  rabbitmq:
    build: rabbitmq
    ports:
      - 127.0.0.1:15673:5672
      - 127.0.0.1:25672:15672
    restart: always

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.0
    ports:
      - 127.0.0.1:8858:8858
    restart: always

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 127.0.0.1:9090:9090
    restart: always

  grafana:
    image: grafana/grafana:10.4.2
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - 127.0.0.1:3001:3000
    depends_on:
      - prometheus
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Shanghai
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    restart: always

  gateway:
    build: gateway
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-duck-saver-dev-jwt-secret}
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 10000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 20s
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      - nacos-server
      - redis
    restart: always

  auth-service:
    build: auth-service
    ports:
      - 127.0.0.1:5000:5000
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MONGODB_HOST: mongodb
      REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-duck-saver-dev-jwt-secret}
    depends_on:
      - nacos-server
      - mongodb
      - redis
    restart: always

  account-service:
    build: account-service
    ports:
      - 127.0.0.1:6000:6000
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MONGODB_HOST: mongodb
    depends_on:
      - nacos-server
      - mongodb
    restart: always

  statistics-service:
    build: statistics-service
    ports:
      - 127.0.0.1:7000:7000
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MONGODB_HOST: mongodb
    depends_on:
      - nacos-server
      - mongodb
    restart: always

  notification-service:
    build: notification-service
    ports:
      - 127.0.0.1:8000:8000
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MONGODB_HOST: mongodb
    depends_on:
      - nacos-server
      - mongodb
    restart: always

  ai-service:
    build: ai-service
    ports:
      - 127.0.0.1:19000:9000
    environment:
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
    depends_on:
      - nacos-server
    restart: always

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 127.0.0.1:80:80
    depends_on:
      - gateway
    restart: always

volumes:
  mongo-data:
  mysql-data:
