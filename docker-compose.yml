
services:
  nacos-server:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - 127.0.0.1:8848:8848
      - 127.0.0.1:9848:9848
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:16379:6379
    restart: always

  rabbitmq:
    build: rabbitmq
    ports:
      - 127.0.0.1:15673:5672
      - 127.0.0.1:25672:15672
    restart: always

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.0
    ports:
      - 127.0.0.1:8858:8858
    restart: always

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 127.0.0.1:9090:9090
    restart: always

  grafana:
    image: grafana/grafana:10.4.2
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - 127.0.0.1:3001:3000
    depends_on:
      - prometheus
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Shanghai
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    restart: always

  gateway:
    build: gateway
    volumes:
      - ./skywalking/agent:/agent:ro
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: gateway
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-duck-saver-dev-jwt-secret}
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 10000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 20s
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      - nacos-server
      - redis
    restart: always

  auth-service:
    build: auth-service
    volumes:
      - ./skywalking/agent:/agent:ro
    ports:
      - 127.0.0.1:5000:5000
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: auth-service
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-duck-saver-dev-jwt-secret}
    depends_on:
      - nacos-server
      - mysql
      - redis
    restart: always

  account-service:
    build: account-service
    volumes:
      - ./skywalking/agent:/agent:ro
    ports:
      - 127.0.0.1:6000:6000
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: account-service
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MYSQL_HOST: mysql
    depends_on:
      - nacos-server
      - mysql
    restart: always

  statistics-service:
    build: statistics-service
    volumes:
      - ./skywalking/agent:/agent:ro
    ports:
      - 127.0.0.1:7000:7000
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: statistics-service
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MYSQL_HOST: mysql
    depends_on:
      - nacos-server
      - mysql
    restart: always

  notification-service:
    build: notification-service
    volumes:
      - ./skywalking/agent:/agent:ro
    ports:
      - 127.0.0.1:8000:8000
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: notification-service
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
      MYSQL_HOST: mysql
    depends_on:
      - nacos-server
      - mysql
    restart: always

  ai-service:
    build: ai-service
    volumes:
      - ./skywalking/agent:/agent:ro
    ports:
      - 127.0.0.1:19000:9000
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/agent/skywalking-agent.jar"
      SW_AGENT_NAME: ai-service
      SW_COLLECTOR_BACKEND_SERVICE: skywalking-oap:11800
      NACOS_SERVER_ADDR: nacos-server:8848
      SENTINEL_DASHBOARD_ADDR: sentinel-dashboard:8858
    depends_on:
      - nacos-server
    restart: always

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:12800:12800
    healthcheck:
      test: ["CMD-SHELL", "/skywalking/bin/swctl ch"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - 127.0.0.1:8082:8080
    depends_on:
      - skywalking-oap
    restart: always

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - 127.0.0.1:3100:3100
    restart: always

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: always

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 127.0.0.1:80:80
    depends_on:
      - gateway
    restart: always

volumes:
  mysql-data:
  nacos-data:
  nacos-logs:
  loki-data:
