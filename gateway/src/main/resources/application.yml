server:
  port: 4000

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/uaa/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/accounts/**
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/statistics/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}

sa-token:
  token-name: satoken
  jwt-secret-key: ${JWT_SECRET_KEY:duck-saver-dev-jwt-secret}
  timeout: 2592000
  is-concurrent: true
  is-share: true
  token-style: uuid

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      application: ${spring.application.name}
